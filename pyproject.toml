[project]
name = "glaucoma-seg"
version = "0.1.0"
description = "Optic disc and cup segmentation in fundus photos with a two-stage PyTorch U-Net, and vertical cup-to-disc ratio estimation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Syed Muhammad Hassan Raza" }]
keywords = ["pytorch", "u-net", "segmentation", "medical-imaging", "glaucoma", "fundus"]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "albumentations>=1.4",
    "scipy>=1.11",
    "pillow>=10",
    "tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/smhassanraza1/glaucoma-disc-cup-segmentation"

[project.optional-dependencies]
demo = ["gradio>=5"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glaucoma"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
